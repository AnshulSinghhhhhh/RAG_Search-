[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-secondbrain"
version = "0.2.0"
description = "A local multimodal memory with a shared CLI and visual search interface"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.7,<3", "uvicorn>=0.30,<1", "numpy>=1.26,<3",
  "Pillow>=10.3,<14", "fastembed>=0.7,<1", "rapidocr>=3,<4",
  "onnxruntime>=1.17,!=1.20.0,!=1.24.0,!=1.24.1,<2", "watchdog>=4,<7",
  "mmh3>=4.1,<5.3",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.1,<2", "ctranslate2>=4.5,<4.7"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2"]

[project.scripts]
brain = "secondbrain.cli:main"

[tool.setuptools.packages.find]
include = ["secondbrain*"]

[tool.setuptools.package-data]
secondbrain = ["web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: integration tests requiring downloaded models"]
